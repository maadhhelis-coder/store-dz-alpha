name: Database Backup

# نسخ احتياطي حقيقي يومي لقاعدة بيانات الإنتاج — راجع Deployment Audit HIGH-01: مشروع
# Supabase الحالي على خطة Free (تحقّقنا فعليًا عبر Management API: pitr_enabled=false،
# backups=[] فارغة تمامًا) فلا يوجد أي نسخ احتياطي تلقائي من Supabase نفسها. هذا الـworkflow
# يعوّض ذلك بـpg_dump يومي حقيقي، يُرفَع كـartifact في هذا المستودع الخاص فقط.
#
# حارس على مستوى الـjob (github.repository) مقصود ومهم: نفس ملفات هذا المشروع تُدفَع لكلا
# المستودعين (store-dz-e2e-verify الخاص، وstore-dz-alpha العام المتصل بـVercel). لو عمل هذا
# الـworkflow على المستودع العام لأصبحت نسخة قاعدة بيانات حقيقية (بيانات عملاء: أسماء،
# هواتف، عناوين) قابلة للتحميل من أي شخص على الإنترنت. الحارس يضمن توقف الـjob فورًا إن شغّله
# GitHub خطأً على مستودع غير هذا، حتى لو أُضيف الـsecret هناك بالغلط مستقبلًا.

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC يوميًا
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'maadhhelis-coder/store-dz-e2e-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require production database secret
        run: |
          if [ -z "${{ secrets.PROD_DATABASE_DIRECT_URL }}" ]; then
            echo "::error::PROD_DATABASE_DIRECT_URL secret is not configured — cannot take a real backup. See Deployment Audit HIGH-01."
            exit 1
          fi

      # بدل تثبيت postgresql-client-17 عبر مستودع PGDG (apt-get): اكتُشف فعليًا فسير عمل
      # آخر (e2e.yml/db-resilience.yml بهذا المستودع) أن apt-get قد يتعثّر لعشرات الدقائق حتى
      # انتهاء المهلة، حتى فتشغيلات كانت "ناجحة" سابقًا (34.5 دقيقة لخطوة مماثلة). صورة
      # postgres:17-alpine الرسمية (تُسحَب من Docker Hub، سجل مختلف تمامًا عن مرايا أوبنتو)
      # تحمل نفس عميل pg_dump/pg_restore/psql المطابق لإصدار Supabase (17.6) دون أي apt-get،
      # وتُلغي أيضًا كل تعقيد pg_createcluster/pg_lsclusters اليدوي أدناه سابقًا (اكتُشف فعليًا:
      # "systemctl start" فشل بلا systemd كامل، ثم "pg_ctlcluster" فشل بعدم وجود العنقود
      # افتراضيًا فهذه البيئة) — حاوية Postgres حقيقية تبدأ بمنطقها الخاص القياسي بدل ذلك.
      - name: Dump production database
        env:
          DIRECT_URL: ${{ secrets.PROD_DATABASE_DIRECT_URL }}
        run: |
          set -euo pipefail
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          echo "DUMP_NAME=db-backup-${timestamp}" >> "$GITHUB_ENV"
          # --schema=public مقصود — راجع اكتشاف فعلي: نسخة كاملة بلا هذا القيد تضم مخططات
          # Supabase الداخلية (vault، extensions...) التي تعتمد على إضافات خاصة بصورة Postgres
          # المُدارة من Supabase نفسها ولا يمكن استعادتها على خادم عادي (فشل فعلي: "extension
          # supabase_vault is not available"). ما يهمّنا فعليًا للتعافي من كارثة هو بيانات
          # المتجر الحقيقية (طلبات، منتجات، عملاء...) التي يديرها Prisma كلها داخل public فقط —
          # بنية auth/vault/realtime تبقى مسؤولية Supabase المُدارة نفسها، لا هذا النسخ الاحتياطي.
          docker run --rm -v /tmp:/tmp -e DIRECT_URL postgres:17-alpine \
            pg_dump "$DIRECT_URL" --schema=public --format=custom --no-owner --no-privileges --file="/tmp/backup.dump"
          size=$(stat -c%s /tmp/backup.dump)
          echo "backup size: ${size} bytes"
          if [ "$size" -lt 1000 ]; then
            echo "::error::backup file suspiciously small — pg_dump likely failed silently"
            exit 1
          fi

      # إثبات فعلي أن النسخة قابلة للاستعادة، لا الاكتفاء بنجاح pg_dump — راجع القاعدة
      # الأصلية: "لا تقل Backup موجود إذا لم تتحقق من إمكانية Restore فعليًا". يستعيد نفس
      # ملف /tmp/backup.dump الحقيقي إلى حاوية Postgres 17 مؤقّتة على هذا الـrunner نفسه
      # (لا تلمس الإنتاج إطلاقًا)، ثم يتحقق من وجود بيانات حقيقية بعد الاستعادة.
      - name: Verify the backup actually restores
        run: |
          set -euo pipefail
          docker run -d --name restore-check -e POSTGRES_PASSWORD=restorecheck -e POSTGRES_DB=restore_check postgres:17-alpine
          for i in $(seq 1 15); do
            docker exec restore-check pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec restore-check pg_isready -U postgres
          docker cp /tmp/backup.dump restore-check:/tmp/backup.dump
          # --clean --if-exists مقصود — راجع اكتشاف فعلي: بلا هذا الخيار يفشل pg_restore بـ
          # "schema public already exists" لأن أي قاعدة بيانات جديدة تُنشأ بمخطط public جاهز
          # أصلًا، فيتعارض مع أمر CREATE SCHEMA public داخل النسخة. هذا سلوك pg_restore معروف
          # عند الاستعادة لقاعدة جديدة، لا خللًا فالنسخة نفسها.
          docker exec -e PGPASSWORD=restorecheck restore-check \
            pg_restore -U postgres --clean --if-exists --no-owner --no-privileges -d restore_check /tmp/backup.dump
          TABLE_COUNT=$(docker exec -e PGPASSWORD=restorecheck restore-check \
            psql -U postgres -d restore_check -t -c \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';" | tr -d '[:space:]')
          echo "restored table count: ${TABLE_COUNT}"
          if [ "$TABLE_COUNT" -lt 10 ]; then
            echo "::error::restore produced suspiciously few tables — backup may not be truly restorable"
            exit 1
          fi
          ORDER_COLUMNS=$(docker exec -e PGPASSWORD=restorecheck restore-check \
            psql -U postgres -d restore_check -t -c \
            "SELECT COUNT(*) FROM information_schema.columns WHERE table_name='orders';" | tr -d '[:space:]')
          echo "restored 'orders' table column count: ${ORDER_COLUMNS}"
          if [ "$ORDER_COLUMNS" -lt 1 ]; then
            echo "::error::restored database is missing the orders table — restore did not actually work"
            exit 1
          fi
          docker rm -f restore-check >/dev/null

      - name: Upload backup artifact (private repo only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.DUMP_NAME }}
          path: /tmp/backup.dump
          retention-days: 30
