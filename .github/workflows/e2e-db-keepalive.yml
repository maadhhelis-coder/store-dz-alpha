name: E2E DB Keepalive

# مشروع Supabase الاختباري (store-dz-e2e-test) على الخطة المجانية يتوقف تلقائيًا
# بعد أسبوع بلا نشاط، فتفشل e2e وdocker-verify بـ"tenant/user not found" و401
# عند أول PR بعد فترة هدوء — حدث فعليًا في PR #60 وكلّف تشخيصًا ودورتَي CI.
#
# نبضة أسبوعية واحدة تكفي لإبقائه نشطًا. اخترنا `prisma migrate status` بدل
# استعلام فارغ لأنه يقرأ القاعدة فعلًا (نشاط حقيقي) ويكشف في الوقت نفسه أي
# انحراف بين ترحيلات المستودع وقاعدة الاختبار — فحص مجاني على الطريق.
#
# ملاحظة: GitHub يعطّل الجداول الزمنية تلقائيًا بعد 60 يومًا من خمول المستودع.

on:
  schedule:
    - cron: "0 6 * * 1" # كل اثنين 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-db-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # يفشل بصوت واضح لو توقف المشروع أو انحرفت ترحيلاته — وهو المقصود:
      # اكتشاف المشكلة في نبضة أسبوعية أرخص من اكتشافها داخل PR.
      - name: Touch test database (keeps the free-tier project awake)
        run: npx prisma migrate status
