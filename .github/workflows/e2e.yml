name: E2E Tests

# متطلب #3: CI قابل لإعادة التشغيل تلقائيًا — يعمل على كل push/PR لأي فرع، ويمكن أيضًا
# تشغيله يدويًا (workflow_dispatch) عند الحاجة لإعادة تحقق فورية بلا commit جديد.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# permissions أدنى صراحة — راجع Deployment Audit LOW-01.
permissions:
  contents: read

# يمنع تشغيلين متزامنين لنفس الفرع — كلاهما يستهدف نفس قاعدة بيانات الإنتاج المشتركة
# (عزل منطقي فقط، وليس قاعدة بيانات اختبار منفصلة — راجع tests/e2e/README.md)، فتشغيلان
# متوازيان قد يتسابقان على حدود معدل حقيقية (Rate Limiters) أو على تنظيف بيانات بعضهما.
#
# ملاحظة (Deployment Audit MED-01): هذا concurrency group منفصل عمدًا عن docker-verify.yml
# (اسم مختلف)، فكلا الـworkflow كانا يعملان متوازيَين فعليًا على نفس push، ويكتبان لنفس
# قاعدة البيانات الحقيقية سابقًا — أحد أسباب فشل E2E المتقطّع المُلاحَظ فعليًا. بعد إزالة
# الأسرار الحقيقية من هذا المستودع (راجع CRIT-01)، هذا الـworkflow متوقف مؤقتًا (راجع خطوة
# "Require test environment secrets" أدناه) فلم يعد هذا التضارب قائمًا فعليًا الآن، لكن
# الاسم أُبقي منفصلًا عمدًا تحسّبًا لإعادة التفعيل المستقبلية بقاعدة اختبار حقيقية منفصلة.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEXT_PUBLIC_ORDER_ENDPOINT: ${{ secrets.NEXT_PUBLIC_ORDER_ENDPOINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 22+ مطلوب فعليًا: @supabase/realtime-js الحالي يحتاج WebSocket أصلي فـNode (مضاف
          # فNode 22)، واكتُشف هذا حقيقيًا فتشغيلة CI فعلية سابقة فشلت بوضوح على Node 20:
          # "Node.js detected but native WebSocket not found... Ensure you are running
          # Node.js 22+" — عند globalSetup.ts الذي يُنشئ عملاء Supabase Admin حقيقيين.
          node-version: 22
          cache: npm

      # فشل سريع وواضح بدل تسلسل فشل مُربِك عبر عشرات الخطوات: الأسرار الحقيقية أُزيلت عمدًا
      # من هذا المستودع (راجع Deployment Audit CRIT-01 — كانت أسرار إنتاج حقيقية بلا حماية
      # فرع). حتى تُضبَط أسرار مشروع Supabase **تجريبي منفصل** (وليس الإنتاج) بنفس الأسماء،
      # هذا الـworkflow يفشل هنا فورًا برسالة واضحة بدل محاولة البناء بلا اتصال قاعدة بيانات.
      - name: Require test environment secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::E2E suite requires DATABASE_URL/DIRECT_URL/NEXT_PUBLIC_SUPABASE_* secrets pointing to a DEDICATED TEST Supabase project (not production). These were intentionally removed from this repo after Deployment Audit CRIT-01 found real production credentials stored here without branch protection. Provision a separate test project and re-add these secrets to re-enable this workflow."
            exit 1
          fi

      # تشخيص مؤقت — يُزال بعد تحديد السبب: signInWithPassword فتطبيقنا يفشل باستمرار
      # بـ"Unexpected end of JSON input" فتشغيلات CI حقيقية (راجع authService.ts)، بينما نفس
      # الطلب عبر curl مباشر من هذه الآلة المحلية نجح مرارًا. هذه الخطوة تختبر نفس نقطة
      # النهاية بـcurl خام مباشرة من شبكة GitHub Actions نفسها (بلا Next.js/undici/gotrue-js
      # فالمنتصف إطلاقًا) لتحديد: هل المشكلة فشبكة/خادم Supabase من هذه البيئة تحديدًا، أم
      # فطبقة تطبيقنا فقط؟
      - name: DIAGNOSTIC — raw curl to Supabase Auth token endpoint (5x)
        run: |
          # NEXT_PUBLIC_ ليست سرًا حقيقيًا (تُشحَن أصلًا لحزمة العميل) — طباعتها آمنة.
          echo "NEXT_PUBLIC_SUPABASE_URL=[$NEXT_PUBLIC_SUPABASE_URL]"
          echo "--- attempt 1 with -L -D- (follow redirects, dump headers) ---"
          curl -sS -L -D- -o /tmp/resp_1.json -w "\nHTTP_STATUS:%{http_code} SIZE_BYTES:%{size_download} REDIRECTS:%{num_redirects} FINAL_URL:%{url_effective}\n" \
            -X POST "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"e2e-owner@storedz-test.invalid","password":"E2E-Owner-Test-Pw-9f3a7c!"}' \
            || echo "curl exit code: $?"
          echo "body byte count: $(wc -c < /tmp/resp_1.json)"
          head -c 300 /tmp/resp_1.json | tr -d '\n'
          echo

      - name: Install dependencies
        run: npm ci

      # الترحيل يجب أن يُطبَّق هنا صراحة قبل الزرع — playwright.config.ts's webServer يشغّل
      # "npm run build" (الذي يتضمن prisma migrate deploy) لاحقًا فقط عند بدء اختبارات
      # E2E فعليًا، فمشروع Supabase تجريبي جديد فارغ تمامًا لا يملك حتى الجداول بعد فهذه
      # المرحلة. اكتُشف فعليًا: خطوة الزرع فشلت بـ"The table public.categories does not
      # exist" لأنها سبقت أي ترحيل.
      - name: Apply database migrations
        run: npx prisma migrate deploy

      # baseline لا يوجد بلا هذا: getActiveWilaya() فsupport/seedFixtures.ts يتطلب صفًا واحدًا
      # على الأقل فوجود بمشروع Supabase تجريبي جديد فارغ تمامًا. الزرع idempotent (upsert) —
      # آمن التكرار كل تشغيلة.
      - name: Seed baseline data (wilayas/categories)
        run: node --import tsx prisma/seed.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # متطلب #20: بناء إنتاجي حقيقي (build + start)، وليس dev server — playwright.config.ts
      # يشغّل "npm run build && npm run start" داخل webServer، فهذه الخطوة هنا تتحقق مبكرًا
      # أن TypeScript سليم قبل إهدار وقت تشغيل الاختبارات كاملة على بناء سيفشل حتمًا.
      - name: Typecheck
        run: npx tsc --noEmit

      # الاختبارات نفسها تُشغّل "npm run build && npm run start" عبر playwright.config.ts
      # webServer — راجع تحذير العزل المنطقي المطبوع فبداية كل تشغيل عبر global-setup.ts.
      - name: Run E2E suite (production build, all browser projects)
        run: npx playwright test

      # معزول ومُشغَّل أخيرًا عمدًا: يُغرق حد معدّل حقيقي مشترَك بنفس IP لمدة 10 دقائق —
      # أي اختبار كوبون شرعي آخر بعده كان سيفشل زورًا. راجع rate-limit-429.spec.ts.
      - name: Run isolated rate-limit (429) proof — must run last
        run: npx playwright test tests/e2e/rate-limit-429.spec.ts --project=chromium-desktop
        env:
          INCLUDE_RATE_LIMIT_TEST: "1"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # لقطات الشاشة/الفيديوهات/الآثار (traces) عند الفشل فقط — متطلب #16.
      - name: Upload failure artifacts (screenshots/videos/traces)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
