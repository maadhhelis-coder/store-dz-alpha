name: Docker Verify

# تحقق مستقل من إعداد Docker الكامل (Dockerfile + docker-compose.yml + docker-compose.prod.yml)
# على بنية تحتية حقيقية تملك Docker مثبَّتًا مسبقًا (عمّال ubuntu-latest) — بلا حاجة لتثبيت
# Docker Desktop محليًا. لا يعتمد فقط على نجاح "docker build"؛ يبني الصورة فعليًا، يشغّل
# المكدس كاملًا، يتحقق من التواصل الحقيقي بين الخدمات، يثبت بقاء البيانات عبر إعادة الإنشاء،
# يفحص أمان الصورة، ويشغّل بوابات الجودة (typecheck/lint/build) الحالية للمشروع.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # قيمة وهمية غير قابلة للاتصال فعليًا — كافية لأن prisma.config.ts يقرأ DIRECT_URL
      # عبر env() وقت تحميل الإعدادات (يفشل "prisma generate" فخطوة npm ci's postinstall بلا
      # هذا المتغيّر معرَّفًا إطلاقًا، حتى أن generate نفسه لا يحتاج اتصالًا حقيقيًا). لا علاقة
      # لهذا بقاعدة بيانات Docker الفعلية المُستعملة لاحقًا (docker-compose.yml له متغيراته
      # الخاصة المستقلة تمامًا عبر شبكة الحاويات).
      DATABASE_URL: postgresql://storedz:storedz@localhost:5432/storedz
      DIRECT_URL: postgresql://storedz:storedz@localhost:5432/storedz
      # أسرار Supabase حقيقية (نفس ما يستعمله .github/workflows/e2e.yml بالفعل فهذا المستودع) —
      # مطلوبة لاختبار تسجيل دخول Owner حقيقي داخل الحاوية (وليس قيمًا فارغة/محلية فقط). تُقرأ
      # docker-compose.yml هذه القيم عبر ${VAR} تلقائيًا من بيئة الصدفة التي يعمل بها compose.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      # بناء محلي مستقل عن Docker (بلا npm run build — بلا migrate) كخط أساس: يثبت أن
      # "next build" لم يعد يحتاج اتصال DB وقت البناء (بعد إزالة تعداد المنتجات/التصنيفات
      # الساكن غير المُستعمل فعليًا زمن التشغيل — راجع products/[slug]/page.tsx وcategory/[slug]).
      - name: Build sanity check (no DB required, proves build/DB decoupling)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx next build

      - name: Step 1 — Remove any leftover containers/images/volumes from previous runs
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v --remove-orphans || true
          docker system prune -af --volumes || true

      - name: Step 2 — Build every image from scratch (no cache)
        run: docker compose build --no-cache

      - name: Step 3 — Bring the full stack up (db + redis + redis-http + migrate + app)
        run: docker compose up -d

      - name: Wait for app to report healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' store-dz-app-1 2>/dev/null || echo starting)
            echo "attempt $i: app health = $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::app container never became healthy"
          docker compose ps
          docker compose logs
          exit 1

      - name: Step 4 — Prove services actually communicate (real HTTP, not just container status)
        run: |
          # -L: trailingSlash:true (next.config.ts) يُرجع 308 نحو المسار بـ"/" — curl -f بلا -L
          # يفشل على أي رد غير 2xx فورًا، بعكس wget (المُستعمل فـHEALTHCHECK) الذي يتبع التحويل
          # تلقائيًا؛ هذا الفرق تحديدًا هو ما فشل هنا فمحاولة سابقة رغم أن التطبيق فعليًا سليم.
          curl -sfL http://localhost:3000/api/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl -sfL http://localhost:3000/ -o /dev/null
          curl -sfL http://localhost:3000/api/wilayas | tee /tmp/wilayas.json
          grep -q "wilayas" /tmp/wilayas.json

      - name: Step 5a — Prove Postgres + Prisma migrations actually applied (real tables, real seed data)
        run: |
          docker compose exec -T db psql -U storedz -d storedz -c "\dt" | grep -q "orders"
          docker compose exec -T db psql -U storedz -d storedz -c "SELECT COUNT(*) FROM wilayas;" | grep -E "5[0-9]|4[0-9]"

      - name: Step 5b — Prove Redis + the Upstash-REST facade are wired correctly end-to-end
        run: |
          # serverless-redis-http عمدًا لا يدعم أوامر عبر مسار URL (مثل /set/key/value) —
          # موثَّق رسميًا: "Only the body method is implemented, which the @upstash/redis SDK
          # uses." — نفس عميل التطبيق الحقيقي (src/lib/rateLimit/upstash.ts) يرسل JSON array
          # كجسم POST، فهذا هو الاختبار الحقيقي المطابق لما يفعله التطبيق فعليًا.
          docker compose exec -T app wget -qO- "http://redis-http:80/" \
            --header="Authorization: Bearer local-dev-token" \
            --header="Content-Type: application/json" \
            --post-data='["SET","docker-verify-key","hello"]'
          docker compose exec -T redis redis-cli get docker-verify-key | grep -q hello

      - name: "Step 5c — Real admin login inside the container (real Supabase creds, not empty values)"
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL secret is not set — cannot prove real admin login"
            exit 1
          fi
          # نفس حساب Owner الدائم الحقيقي المُستعمل فـtests/e2e (راجع
          # tests/e2e/support/adminFixtures.ts) — وليس بيانات وهمية. صف AdminUser المطابق فقاعدة
          # بيانات Docker المحلية هذه أُنشئ عبر scripts/dockerVerifySeed.ts (خدمة migrate)، مربوطًا
          # بنفس حساب Supabase Auth الحقيقي الخارجي (مشترك، غير معزول لكل بيئة).
          OWNER_EMAIL="e2e-owner@storedz-test.invalid"
          OWNER_PASSWORD="E2E-Owner-Test-Pw-9f3a7c!"

          LOGIN_CODE=$(curl -sL -o /tmp/login-response.json -w "%{http_code}" -c /tmp/owner-cookies.txt \
            -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$OWNER_EMAIL\",\"password\":\"$OWNER_PASSWORD\"}")
          echo "login status: $LOGIN_CODE"
          cat /tmp/login-response.json
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "::error::real admin login failed (status $LOGIN_CODE)"
            exit 1
          fi
          grep -q "$OWNER_EMAIL" /tmp/login-response.json

          # إثبات أن الجلسة الحقيقية تفتح فعليًا مسارًا إداريًا محميًا (200)...
          PROTECTED_CODE=$(curl -sL -o /dev/null -w "%{http_code}" -b /tmp/owner-cookies.txt \
            "http://localhost:3000/api/admin/orders?page=1&pageSize=5")
          echo "protected route WITH session: $PROTECTED_CODE"
          if [ "$PROTECTED_CODE" != "200" ]; then
            echo "::error::authenticated request to a protected admin route did not return 200"
            exit 1
          fi

          # ...بينما نفس المسار بلا أي جلسة يُرفَض فعليًا (401) — يثبت أن الحماية حقيقية،
          # وليست 200 دائمة بصرف النظر عن الجلسة.
          UNAUTH_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "http://localhost:3000/api/admin/orders?page=1&pageSize=5")
          echo "protected route WITHOUT session: $UNAUTH_CODE"
          if [ "$UNAUTH_CODE" != "401" ]; then
            echo "::error::protected admin route did not reject an unauthenticated request (got $UNAUTH_CODE, expected 401)"
            exit 1
          fi

      - name: "Step 5d — Real order creation via HTTP end-to-end, verified directly in Postgres"
        run: |
          ORDER_NUMBER_FILE=/tmp/order-number.txt
          BODY='{"firstName":"DockerVerify","lastName":"OrderTest","phone":"0555123456","wilayaCode":16,"commune":"Alger Centre","deliveryOption":"office","productSlug":"docker-verify-test-product","quantity":1,"visitorId":"docker-verify-order-test"}'

          CODE=$(curl -sL -o /tmp/order-response.json -w "%{http_code}" \
            -X POST http://localhost:3000/api/orders \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "order creation status: $CODE"
          cat /tmp/order-response.json
          if [ "$CODE" != "201" ]; then
            echo "::error::real order creation via HTTP failed (status $CODE)"
            exit 1
          fi

          ORDER_NUMBER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/order-response.json','utf8')).orderNumber)")
          echo "created order number: $ORDER_NUMBER"
          echo "$ORDER_NUMBER" > "$ORDER_NUMBER_FILE"

          # التحقق ليس من رسالة نجاح الواجهة فقط — استعلام مباشر فقاعدة البيانات الحقيقية
          # يتأكد أن الصف فعلًا هناك، وبالبيانات الصحيحة (الاسم، الهاتف، الحالة الابتدائية).
          docker compose exec -T db psql -U storedz -d storedz -t -c \
            "SELECT customer_first_name || '|' || customer_last_name || '|' || phone || '|' || status FROM orders WHERE order_number = '$ORDER_NUMBER';" \
            | tee /tmp/order-db-row.txt
          grep -q "DockerVerify" /tmp/order-db-row.txt
          grep -q "0555123456" /tmp/order-db-row.txt
          grep -q "pending" /tmp/order-db-row.txt

      - name: Step 6 — Restart and force-recreate containers, confirm the app comes back healthy
        run: |
          docker compose restart app
          sleep 5
          docker compose up -d --force-recreate app
          for i in $(seq 1 20); do
            status=$(docker inspect --format='{{.State.Health.Status}}' store-dz-app-1 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::app did not become healthy again after restart/recreate"
          docker compose logs app
          exit 1

      - name: Step 7 — Confirm persistent data survives a full container teardown (volumes kept)
        run: |
          before=$(docker compose exec -T db psql -U storedz -d storedz -t -c "SELECT COUNT(*) FROM wilayas;" | tr -d '[:space:]')
          echo "wilaya count before: $before"
          docker compose down --remove-orphans
          docker compose up -d
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' store-dz-app-1 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then break; fi
            sleep 5
          done
          after=$(docker compose exec -T db psql -U storedz -d storedz -t -c "SELECT COUNT(*) FROM wilayas;" | tr -d '[:space:]')
          echo "wilaya count after: $after"
          if [ "$before" != "$after" ] || [ -z "$after" ] || [ "$after" = "0" ]; then
            echo "::error::persistent data did not survive container recreation (before=$before after=$after)"
            exit 1
          fi

      - name: "Step 8 — Real production runtime (prod overlay: restart always, resource limits, read-only rootfs, cap_drop ALL)"
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' store-dz-app-1 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::app never became healthy under the production overlay"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs app
          exit 1

      - name: Step 8b — Confirm the production container truly runs as non-root
        run: docker compose exec -T app id | grep -q "uid=1001"

      - name: Step 8c — Confirm the app still answers real requests under the read-only-rootfs overlay
        run: curl -sfL http://localhost:3000/api/health | grep -q '"status":"ok"'

      - name: "Step 8d — Graceful shutdown: real in-flight requests + measured SIGTERM handling"
        run: |
          rm -f /tmp/shutdown-requests.log
          # 8 طلبات إنشاء طلب حقيقية (رقم هاتف/معرّف جهاز/لقب فريد لكل واحد لتفادي حدود معدّل
          # الطلبات الحقيقية)، تُطلَق بفارق 300ms بعضها عن بعض — تمتد قرابة 2.5 ثانية، فيضمن هذا
          # وجود طلب "قيد التنفيذ فعليًا" (in-flight) لحظة إرسال SIGTERM لاحقًا، وليس افتراضًا.
          fire_order() {
            n=$1
            phone=$(printf "0555%06d" "$n")
            body="{\"firstName\":\"Shutdown\",\"lastName\":\"Test$n\",\"phone\":\"$phone\",\"wilayaCode\":16,\"commune\":\"Alger Centre\",\"deliveryOption\":\"office\",\"productSlug\":\"docker-verify-test-product\",\"quantity\":1,\"visitorId\":\"shutdown-test-$n\"}"
            code=$(curl -sL -o /tmp/shutdown-resp-$n.json -w "%{http_code}" -m 20 \
              -X POST http://localhost:3000/api/orders -H "Content-Type: application/json" -d "$body")
            echo "n=$n code=$code" >> /tmp/shutdown-requests.log
          }

          for i in 1 2 3 4 5 6 7 8; do
            fire_order "$i" &
            sleep 0.3
          done
          sleep 0.5

          SIGTERM_TS=$(date +%s.%N)
          docker compose -f docker-compose.yml -f docker-compose.prod.yml stop --timeout 30 app
          STOPPED_TS=$(date +%s.%N)

          wait   # ننتظر انتهاء كل الطلبات المُطلَقة فالخلفية (بعضها كان قيد التنفيذ فعليًا وقت SIGTERM)

          DURATION=$(node -e "console.log((${STOPPED_TS} - ${SIGTERM_TS}).toFixed(2))")
          echo "measured shutdown duration: ${DURATION}s"

          EXIT_CODE=$(docker inspect store-dz-app-1 --format='{{.State.ExitCode}}')
          echo "container exit code after SIGTERM: $EXIT_CODE"

          echo "--- per-request results (n / http status) ---"
          cat /tmp/shutdown-requests.log

          # 143 = 128+15 (SIGTERM) هو الخروج الصحيح المتوقَّع لعملية استقبلت الإشارة وأنهت
          # نفسها بأدب (اصطلاح POSIX قياسي) — وليس فشلًا. 137 = 128+9 (SIGKILL) هو الفشل
          # الفعلي: يعني Docker اضطُرَّ لقتل العملية قسرًا بعد انتهاء مهلة --timeout 30 بلا
          # استجابة، أي أن الإغلاق الرشيق تعطَّل فعليًا. أي رمز آخر غير متوقَّع أيضًا.
          if [ "$EXIT_CODE" = "137" ]; then
            echo "::error::app was force-killed (SIGKILL, exit 137) after the 30s stop timeout — graceful shutdown did not complete in time"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "143" ]; then
            echo "::error::unexpected exit code $EXIT_CODE after SIGTERM (expected 0 or 143)"
            exit 1
          fi

          SUCCESS_COUNT=$(grep -c "code=201" /tmp/shutdown-requests.log || true)
          echo "in-flight requests that completed successfully (201) despite SIGTERM: $SUCCESS_COUNT / 8"
          if [ "$SUCCESS_COUNT" -lt 1 ]; then
            echo "::error::not a single in-flight request completed successfully during shutdown — graceful shutdown is not actually working"
            exit 1
          fi

      - name: "Step 8e — Confirm the in-flight orders from the shutdown test actually persisted (no data loss)"
        run: |
          docker compose exec -T db psql -U storedz -d storedz -t -c \
            "SELECT phone, status FROM orders WHERE customer_first_name = 'Shutdown' AND customer_last_name LIKE 'Test%';" \
            | tee /tmp/shutdown-orders-db.txt
          DB_COUNT=$(grep -c "|" /tmp/shutdown-orders-db.txt || true)
          echo "shutdown-test orders found in Postgres: $DB_COUNT"
          if [ "$DB_COUNT" -lt 1 ]; then
            echo "::error::the in-flight request(s) that returned 201 did not actually persist to Postgres — real data loss during shutdown"
            exit 1
          fi

      - name: Step 9 — Security scan the production image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: store-dz-app:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
          output: trivy-report.txt

      - name: Step 10 — Full project quality gates already ran above (typecheck, lint, build) — record confirmation
        run: echo "typecheck, eslint, and next build all passed earlier in this job (job fails fast otherwise)"

      - name: Dump full stack logs (regression evidence)
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color > docker-compose-full.log

      - name: Upload verification artifacts (logs + security scan)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-verify-evidence
          path: |
            docker-compose-full.log
            trivy-report.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Final cleanup (containers, images, volumes)
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v --remove-orphans || true
          docker system prune -af --volumes || true
